name: build-scan-push
description: >
  Build the multistage image, scan it with Trivy (gate on HIGH/CRITICAL), and
  optionally push to ECR. Lint/test live in the python-checks composite; run that
  first for backend services. Assumes the job has logged in to ECR when push=true.

inputs:
  service:
    description: Service name; also the ECR repo suffix (e.g. property-service).
    required: true
  context:
    description: Docker build context path (e.g. backend/property-service or frontend).
    required: true
  registry:
    description: ECR registry host, e.g. <account>.dkr.ecr.us-east-1.amazonaws.com.
    required: true
  image-tag:
    description: Image tag to build (the git SHA).
    required: true
  push:
    description: "'true' to push after a clean scan (main); 'false' for PR builds."
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Build image (multistage)
      shell: bash
      run: |
        docker build \
          -t "${{ inputs.registry }}/rentlora-${{ inputs.service }}:${{ inputs.image-tag }}" \
          "${{ inputs.context }}"

    # Scan to SARIF (HIGH + CRITICAL) and publish to the GitHub Security tab. Never
    # fails here — the gate below is what blocks. Results appear under
    # Security → Code scanning, one category per service.
    - name: Trivy scan — SARIF
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: "${{ inputs.registry }}/rentlora-${{ inputs.service }}:${{ inputs.image-tag }}"
        format: sarif
        output: "trivy-${{ inputs.service }}.sarif"
        severity: HIGH,CRITICAL
        exit-code: "0"
        ignore-unfixed: true
        vuln-type: os,library

    - name: Upload Trivy SARIF to code scanning
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: "trivy-${{ inputs.service }}.sarif"
        category: "image-${{ inputs.service }}"

    # Only CRITICAL blocks the deploy. HIGH base-image/OS findings are visible in the
    # Security tab and tracked as tech-debt (see .trivyignore); tighten this back to
    # HIGH once they're remediated.
    - name: Trivy gate — fail on CRITICAL
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: "${{ inputs.registry }}/rentlora-${{ inputs.service }}:${{ inputs.image-tag }}"
        format: table
        severity: CRITICAL
        exit-code: "1"
        ignore-unfixed: true
        vuln-type: os,library

    - name: Push to ECR
      if: ${{ inputs.push == 'true' }}
      shell: bash
      run: docker push "${{ inputs.registry }}/rentlora-${{ inputs.service }}:${{ inputs.image-tag }}"
