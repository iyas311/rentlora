# Build pipeline — CI + automatic dev deploy.
#
# Flow: push to main → detect which services changed → (only those) ruff → pytest →
#       docker build → Trivy gate → push to ECR → bump that service's tag in
#       environments/dev/values.yaml (per-service) → ArgoCD auto-syncs dev →
#       verify rollout (via deploy.yml, target=dev).
#
# A one-service change rebuilds + redeploys only that service. workflow_dispatch
# (manual) rebuilds all six.
#
# Required repo secrets:
#   AWS_CI_ROLE_ARN    arn of the rentlora-eks-ci role (OIDC; no static keys)
#   HELM_REPO_TOKEN    PAT with write access to rentlora/rentlora-helm
#   SLACK_WEBHOOK_URL  Slack incoming webhook (optional; notifications skipped if unset)
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write          # OIDC -> assume AWS role
  contents: read
  security-events: write   # upload Trivy SARIF to code scanning

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  # Which services changed? Outputs a JSON array consumed as the build matrix.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend: ['frontend/**']
            property-service: ['backend/property-service/**']
            booking-service: ['backend/booking-service/**']
            ai-service: ['backend/ai-service/**']
            admin-service: ['backend/admin-service/**']
            ai-search-service: ['backend/ai-search-service/**']
      - name: Resolve service list
        id: set
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual run rebuilds everything.
            echo 'services=["frontend","property-service","booking-service","ai-service","admin-service","ai-search-service"]' >> "$GITHUB_OUTPUT"
          else
            echo 'services=${{ steps.filter.outputs.changes }}' >> "$GITHUB_OUTPUT"
          fi
          echo "Changed services: ${{ steps.filter.outputs.changes }}"

  build:
    name: build ${{ matrix.service }}
    needs: changes
    if: ${{ needs.changes.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve context
        id: ctx
        shell: bash
        run: |
          if [ "${{ matrix.service }}" = "frontend" ]; then
            echo "context=frontend" >> "$GITHUB_OUTPUT"
            echo "python=false"     >> "$GITHUB_OUTPUT"
          else
            echo "context=backend/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
            echo "python=true"                            >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Lint + test (Python services)
        if: ${{ steps.ctx.outputs.python == 'true' }}
        uses: ./.github/actions/python-checks
        with:
          context: ${{ steps.ctx.outputs.context }}

      - name: Build, scan, push
        uses: ./.github/actions/build-scan-push
        with:
          service: ${{ matrix.service }}
          context: ${{ steps.ctx.outputs.context }}
          registry: ${{ steps.ecr.outputs.registry }}
          image-tag: ${{ github.sha }}
          push: "true"

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify
        with:
          status: failure
          title: "build failed: ${{ matrix.service }}"
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          details: "commit ${{ github.sha }}"

  bump-dev:
    name: bump dev image tags
    needs: [changes, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # rentlora — for the local notify action

      - name: Checkout rentlora-helm
        uses: actions/checkout@v4
        with:
          repository: rentlora/rentlora-helm
          token: ${{ secrets.HELM_REPO_TOKEN }}
          path: helm

      - name: Bump changed services in dev imageTags
        shell: bash
        env:
          TAG: ${{ github.sha }}
          SERVICES: ${{ needs.changes.outputs.services }}
        run: |
          cd helm
          for svc in $(echo "$SERVICES" | jq -r '.[]'); do
            yq -i ".imageTags.\"${svc}\" = \"${TAG}\"" environments/dev/values.yaml
            echo "  bumped ${svc} -> ${TAG}"
          done
          git config user.name  "rentlora-ci"
          git config user.email "ci@rentlora.in"
          git add environments/dev/values.yaml
          git commit -m "ci: dev bump ${SERVICES} -> ${TAG}" || { echo "no change to commit"; exit 0; }
          git push

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify
        with:
          status: failure
          title: "dev tag bump failed"
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          details: "commit ${{ github.sha }}"

  deploy-dev:
    name: verify dev rollout
    needs: [changes, bump-dev]
    uses: ./.github/workflows/deploy.yml
    with:
      target: dev
      image-tag: ${{ github.sha }}
      services: ${{ needs.changes.outputs.services }}
    secrets: inherit
