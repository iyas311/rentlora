name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  security-events: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:          ['frontend/**']
            property-service:  ['backend/property-service/**']
            booking-service:   ['backend/booking-service/**']
            ai-service:        ['backend/ai-service/**']
            admin-service:     ['backend/admin-service/**']
            ai-search-service: ['backend/ai-search-service/**']
            user-service:      ['backend/user-service/**']
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'services=["frontend","property-service","booking-service","ai-service","admin-service","ai-search-service","user-service"]' >> "$GITHUB_OUTPUT"
          else
            echo 'services=${{ steps.filter.outputs.changes }}' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve build context
        id: ctx
        run: |
          if [ "${{ matrix.service }}" = "frontend" ]; then
            echo "context=frontend" >> "$GITHUB_OUTPUT"
          else
            echo "context=backend/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      # Build locally first — Trivy gates before the image reaches ECR.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.ctx.outputs.context }}
          push: false
          load: true
          tags: ${{ steps.ecr.outputs.registry }}/rentlora-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Trivy gate — CRITICAL
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/rentlora-${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library

      - name: Trivy scan — SARIF
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/rentlora-${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: image-${{ matrix.service }}

      - name: Push to ECR
        run: docker push ${{ steps.ecr.outputs.registry }}/rentlora-${{ matrix.service }}:${{ github.sha }}

      - name: Notify failure
        if: failure()
        uses: ./.github/actions/notify
        with:
          status: failure
          title: "build failed: ${{ matrix.service }}"
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          details: "commit ${{ github.sha }}"

  bump-dev:
    name: bump dev image tags
    needs: [changes, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Checkout rentlora-helm
        uses: actions/checkout@v4
        with:
          repository: rentlora/rentlora-helm
          token: ${{ secrets.HELM_REPO_TOKEN }}
          path: helm

      - name: Bump changed services
        env:
          TAG: ${{ github.sha }}
          SERVICES: ${{ needs.changes.outputs.services }}
        run: |
          cd helm
          for svc in $(echo "$SERVICES" | jq -r '.[]'); do
            yq -i ".imageTags.\"${svc}\" = \"${TAG}\"" environments/dev/values.yaml
          done
          git config user.name  "rentlora-ci"
          git config user.email "ci@rentlora.in"
          git add environments/dev/values.yaml
          git commit -m "ci: bump dev [${SERVICES}] → ${TAG}" || exit 0
          git push

      - name: Notify success
        if: success()
        uses: ./.github/actions/notify
        with:
          status: success
          title: "dev deploy triggered"
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          details: "ArgoCD syncing → dev.rentlora.in | commit ${{ github.sha }}"

      - name: Notify failure
        if: failure()
        uses: ./.github/actions/notify
        with:
          status: failure
          title: "dev tag bump failed"
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          details: "commit ${{ github.sha }}"
