name: ci-backend

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            property-service:  ['backend/property-service/**']
            booking-service:   ['backend/booking-service/**']
            ai-service:        ['backend/ai-service/**']
            admin-service:     ['backend/admin-service/**']
            ai-search-service: ['backend/ai-search-service/**']
            user-service:      ['backend/user-service/**']
      - id: set
        run: echo 'services=${{ steps.filter.outputs.changes }}' >> "$GITHUB_OUTPUT"

  # Stage 1 — compile + lint (parallel per service)
  compile-lint:
    name: compile + lint (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-checks
        with:
          context: backend/${{ matrix.service }}

  # Stage 2 — SAST; only runs if every compile-lint leg passed
  sast:
    name: SAST (SonarCloud)
    needs: [changes, compile-lint]
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Stage 3 — SCA; only runs if SAST passed (parallel per service)
  sca:
    name: SCA — Snyk (${{ matrix.service }})
    needs: [changes, sast]
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/${{ matrix.service }}/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install service deps
        working-directory: backend/${{ matrix.service }}
        run: pip install -r requirements.txt
      - uses: ./.github/actions/snyk-test
        with:
          working-directory: backend/${{ matrix.service }}
          args: --file=requirements.txt --package-manager=pip

  # Stage 4 — image build + Trivy; only runs if all SCA legs passed (parallel per service)
  image-scan:
    name: build + scan (${{ matrix.service }})
    needs: [changes, sca]
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: backend/${{ matrix.service }}
          push: false
          load: true
          tags: rentlora-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=backend-${{ matrix.service }}
      - uses: ./.github/actions/trivy-scan
        with:
          image-ref: rentlora-${{ matrix.service }}:${{ github.sha }}
          category: image-${{ matrix.service }}

  ci-backend-complete:
    name: ci-backend-complete
    if: always()
    needs: [changes, compile-lint, sast, sca, image-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Gate
        env:
          RESULT: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "$RESULT" = "true" ]; then
            echo "One or more backend CI checks failed or were cancelled."
            exit 1
          fi
          echo "Backend CI passed."
      - uses: actions/checkout@v4
        if: failure()
      - name: Notify failure
        if: failure()
        uses: ./.github/actions/notify
        with:
          status: failure
          title: "backend CI failed — PR #${{ github.event.pull_request.number }}"
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          details: "${{ github.head_ref }}"
