name: ci-frontend

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend: ['frontend/**']

  # Stage 1 — lint + build; ESLint catches code issues, vite build confirms everything compiles
  build-check:
    name: lint + build check
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  # Stage 2 — SCA; only runs if build-check passed
  sca:
    name: SCA — Snyk (npm)
    needs: [changes, build-check]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Install Snyk
        run: npm install -g snyk
      - name: Snyk test
        working-directory: frontend
        run: snyk test --severity-threshold=high

  # Stage 3 — image build + Trivy; only runs if SCA passed
  image-scan:
    name: build + scan (frontend)
    needs: [changes, sca]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          load: true
          tags: rentlora-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Trivy gate — CRITICAL
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: rentlora-frontend:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
      - name: Trivy scan — SARIF
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: rentlora-frontend:${{ github.sha }}
          format: sarif
          output: trivy-frontend.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-frontend.sarif
          category: image-frontend

  ci-frontend-complete:
    name: ci-frontend-complete
    if: always()
    needs: [changes, build-check, sca, image-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        env:
          RESULT: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "$RESULT" = "true" ]; then
            echo "Frontend CI checks failed or were cancelled."
            exit 1
          fi
          echo "Frontend CI passed."
