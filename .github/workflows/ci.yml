# PR checks — run on every pull request to main and block the merge until green.
# Verify only: lint, test, SAST (SonarCloud), SCA (Snyk), and image build + Trivy.
# No image is pushed and nothing is deployed here — build.yml handles release on merge.
#
# Required repo secrets: SONAR_TOKEN, SNYK_TOKEN.
name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which services changed in this PR? Only those get linted/tested/scanned.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set.outputs.services }}   # all changed (incl. frontend)
      backends: ${{ steps.set.outputs.backends }}   # changed python services only
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend: ['frontend/**']
            property-service: ['backend/property-service/**']
            booking-service: ['backend/booking-service/**']
            ai-service: ['backend/ai-service/**']
            admin-service: ['backend/admin-service/**']
            ai-search-service: ['backend/ai-search-service/**']
      - name: Resolve service lists
        id: set
        shell: bash
        run: |
          SVCS='${{ steps.filter.outputs.changes }}'
          echo "services=$SVCS" >> "$GITHUB_OUTPUT"
          echo "backends=$(echo "$SVCS" | jq -c '[.[] | select(. != "frontend")]')" >> "$GITHUB_OUTPUT"
          echo "changed services: $SVCS"

  lint-test:
    name: lint+test ${{ matrix.service }}
    needs: changes
    if: ${{ needs.changes.outputs.backends != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.backends) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-checks
        with:
          context: backend/${{ matrix.service }}

  image-scan:
    name: build+scan ${{ matrix.service }}
    needs: changes
    if: ${{ needs.changes.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload Trivy SARIF to code scanning
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve context
        id: ctx
        shell: bash
        run: |
          if [ "${{ matrix.service }}" = "frontend" ]; then
            echo "context=frontend" >> "$GITHUB_OUTPUT"
          else
            echo "context=backend/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build + Trivy scan (no push)
        uses: ./.github/actions/build-scan-push
        with:
          service: ${{ matrix.service }}
          context: ${{ steps.ctx.outputs.context }}
          registry: local          # PR build only — image is scanned, never pushed
          image-tag: ${{ github.sha }}
          push: "false"

  sonarcloud:
    name: SAST (SonarCloud)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0           # full history for accurate new-code analysis
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  snyk:
    name: SCA (Snyk)
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}   # snyk CLI reads this; no `snyk auth` (avoids log leak)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Snyk
        run: npm install -g snyk
      - name: Snyk — frontend (npm)
        working-directory: frontend
        run: |
          npm ci
          snyk test --severity-threshold=high
      - name: Snyk — backend (pip)
        run: |
          for svc in property-service booking-service ai-service admin-service ai-search-service; do
            echo "::group::snyk $svc"
            snyk test --file=backend/$svc/requirements.txt --package-manager=pip --severity-threshold=high
            echo "::endgroup::"
          done

  # Single aggregator so branch protection can require one context ("ci-complete")
  # instead of every matrix leg. Fails if any required job failed or was cancelled.
  ci-complete:
    name: ci-complete
    if: always()
    needs: [changes, lint-test, image-scan, sonarcloud, snyk]
    runs-on: ubuntu-latest
    steps:
      - name: Gate on upstream results
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "One or more CI checks did not pass."; exit 1
          fi
          echo "All CI checks passed."
