# Deploy pipeline — verify a GitOps rollout and run smoke tests.
#
# Two ways in:
#   - Called by build.yml (workflow_call) with target=dev after the dev tag bump.
#   - Manually (workflow_dispatch) to promote a tested tag to production.
#
# Dev vs prod gating is done with GitHub Environments:
#   - 'dev'        : no protection  -> runs automatically from build.yml
#   - 'production' : required reviewers -> manual approval before the job runs
#     (configure under repo Settings → Environments → production)
#
# The actual sync to the cluster is done by ArgoCD (it watches rentlora-helm).
# This workflow optionally bumps the tag, then waits for ArgoCD and verifies.
name: deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        type: choice
        options: [dev, production]
        default: dev
      image-tag:
        description: "Image tag (git SHA) to deploy. Leave blank to just verify current state."
        required: false
        default: ""
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      image-tag:
        type: string
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  CLUSTER: rentlora-eks

jobs:
  deploy:
    name: deploy ${{ inputs.target }}
    runs-on: ubuntu-latest
    # 'production' triggers the approval gate; everything else uses the open 'dev' env.
    environment: ${{ inputs.target == 'production' && 'production' || 'dev' }}
    steps:
      - uses: actions/checkout@v4          # rentlora — for the local notify action

      - name: Resolve environment config
        id: cfg
        shell: bash
        run: |
          if [ "${{ inputs.target }}" = "production" ]; then
            echo "ns=production"      >> "$GITHUB_OUTPUT"
            echo "host=rentlora.in"   >> "$GITHUB_OUTPUT"
            echo "envdir=prod"        >> "$GITHUB_OUTPUT"
          else
            echo "ns=rentlora-dev"        >> "$GITHUB_OUTPUT"
            echo "host=dev.rentlora.in"   >> "$GITHUB_OUTPUT"
            echo "envdir=dev"             >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout rentlora-helm (for tag bump)
        if: ${{ inputs.image-tag != '' }}
        uses: actions/checkout@v4
        with:
          repository: rentlora/rentlora-helm
          token: ${{ secrets.HELM_REPO_TOKEN }}
          path: helm

      - name: Bump image tag in helm
        if: ${{ inputs.image-tag != '' }}
        shell: bash
        env:
          TAG: ${{ inputs.image-tag }}
          ENVDIR: ${{ steps.cfg.outputs.envdir }}
        run: |
          cd helm
          sed -i -E "s/(imageTag:[[:space:]]*)[^[:space:]#]+/\1${TAG}/" "environments/${ENVDIR}/values.yaml"
          git config user.name  "rentlora-ci"
          git config user.email "ci@rentlora.in"
          git add "environments/${ENVDIR}/values.yaml"
          git commit -m "ci: ${ENVDIR} imageTag -> ${TAG}" || echo "no change to commit"
          git push || echo "nothing to push"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"

      - name: Wait for ArgoCD sync + verify rollout
        shell: bash
        env:
          NS: ${{ steps.cfg.outputs.ns }}
          TAG: ${{ inputs.image-tag }}
        run: |
          set -euo pipefail
          services="frontend property-service booking-service ai-service admin-service ai-search-service"
          # If a tag was provided, wait until each Deployment references it before
          # checking rollout (ArgoCD can lag the git commit by a reconcile cycle).
          if [ -n "${TAG}" ]; then
            for d in $services; do
              echo "Waiting for $d to reference :${TAG} ..."
              ok=""
              for _ in $(seq 1 30); do
                img=$(kubectl get deploy "$d" -n "$NS" -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo "")
                case "$img" in
                  *":${TAG}") echo "  $d -> $img"; ok=1; break ;;
                  *) sleep 10 ;;
                esac
              done
              [ -n "$ok" ] || { echo "Timed out waiting for $d to update to :${TAG}"; exit 1; }
            done
          fi
          for d in $services; do
            kubectl rollout status "deploy/$d" -n "$NS" --timeout=180s
          done

      - name: Smoke test
        shell: bash
        env:
          HOST: ${{ steps.cfg.outputs.host }}
        run: |
          set -e
          curl -fsS --retry 5 --retry-delay 10 "https://${HOST}/healthz"        >/dev/null && echo "frontend ok"
          curl -fsS --retry 5 --retry-delay 10 "https://${HOST}/api/properties" >/dev/null && echo "property-service ok"

      - name: Notify success
        if: success()
        uses: ./.github/actions/notify
        with:
          status: success
          title: "deploy ${{ inputs.target }} succeeded"
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          details: "tag ${{ inputs.image-tag }} → ns ${{ steps.cfg.outputs.ns }}"

      - name: Notify failure
        if: failure()
        uses: ./.github/actions/notify
        with:
          status: failure
          title: "deploy ${{ inputs.target }} failed"
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          details: "tag ${{ inputs.image-tag }} → ns ${{ steps.cfg.outputs.ns }}"
