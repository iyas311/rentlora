name: release

on:
  release:
    types: [published]

concurrency: production-release

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  # Snapshot dev imageTags BEFORE the approval gate — what the reviewer approves
  # is exactly what was running in dev at the moment the release was published.
  prepare:
    name: snapshot dev image tags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      imagetags: ${{ steps.snap.outputs.imagetags }}
    steps:
      - name: Checkout rentlora-helm
        uses: actions/checkout@v4
        with:
          repository: rentlora/rentlora-helm
          token: ${{ secrets.HELM_REPO_TOKEN }}

      - name: Snapshot
        id: snap
        run: |
          tags=$(yq '.imageTags' environments/dev/values.yaml -o=json -I=0)
          echo "imagetags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Promoting to prod: ${tags}"

  deploy:
    name: deploy production (${{ github.event.release.tag_name }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Re-tag the exact dev-tested images with the semver release version in ECR.
      # ECR add-a-tag = batch-get-image (read the manifest) + put-image (write the
      # new tag to the same manifest) — no rebuild, no re-push of layers.
      - name: Re-tag promoted images as ${{ github.event.release.tag_name }}
        env:
          IMAGETAGS: ${{ needs.prepare.outputs.imagetags }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          echo "$IMAGETAGS" | jq -r 'to_entries[] | "\(.key) \(.value)"' | while IFS=' ' read -r svc sha; do
            repo="rentlora-${svc}"
            manifest=$(aws ecr batch-get-image --repository-name "$repo" \
              --image-ids imageTag="$sha" --query 'images[0].imageManifest' --output text)
            if [ -z "$manifest" ] || [ "$manifest" = "None" ]; then
              echo "::error::missing image ${repo}:${sha}"; exit 1
            fi
            if aws ecr put-image --repository-name "$repo" --image-tag "$VERSION" \
                 --image-manifest "$manifest" >/dev/null 2>&1; then
              echo "retagged ${repo}:${sha} -> ${VERSION}"
            else
              echo "${repo}:${VERSION} already present (ok)"
            fi
          done

      - name: Checkout rentlora-helm
        uses: actions/checkout@v4
        with:
          repository: rentlora/rentlora-helm
          token: ${{ secrets.HELM_REPO_TOKEN }}
          path: helm

      # Prod runs ONE coherent versioned tag for every service via global.imageTag;
      # drop the per-service SHA map so the charts fall back to it.
      - name: Pin prod to ${{ github.event.release.tag_name }}
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          cd helm
          yq -i ".global.imageTag = \"${VERSION}\"" environments/prod/values.yaml
          yq -i "del(.imageTags)" environments/prod/values.yaml
          yq -i ".releaseVersion = \"${VERSION}\"" environments/prod/values.yaml
          git config user.name  "rentlora-ci"
          git config user.email "ci@rentlora.in"
          git add environments/prod/values.yaml
          git commit -m "release: ${VERSION}"
          git push

      - name: Notify success
        if: success()
        uses: ./.github/actions/notify
        with:
          status: success
          title: "prod release ${{ github.event.release.tag_name }} deployed"
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          details: "ArgoCD syncing → rentlora.in"

      - name: Notify failure
        if: failure()
        uses: ./.github/actions/notify
        with:
          status: failure
          title: "prod release ${{ github.event.release.tag_name }} FAILED"
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          details: "check run logs"
