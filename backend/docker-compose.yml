version: "3.9"
services:
  property-service:
    build: ./property-service
    ports:
      - "8001:8001"
    environment:
      - ENV=${ENV:-production}
    restart: always

  booking-service:
    build: ./booking-service
    ports:
      - "8002:8002"
    environment:
      - ENV=${ENV:-production}
    restart: always

  ai-service:
    build: ./ai-service
    ports:
      - "8003:8003"
    environment:
      - ENV=${ENV:-production}
    restart: always
