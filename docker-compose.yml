version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: rentlora
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rentlora"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  property-service:
    build: ./property-service
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/rentlora
      JWT_SECRET: dev-secret
      S3_BUCKET_NAME: rentlora-assets
      AWS_DEFAULT_REGION: us-east-1

  ai-service:
    build: ./ai-service
    ports:
      - "8003:8003"
    environment:
      JWT_SECRET: dev-secret
      XAI_API_KEY: ${XAI_API_KEY:-xai-I0gPIz79srCEQ0AHDf0FnEKI6yWcE0u4wueW7GY7AZeqG9wKakWH7hx4sz8BTL3XT7dL2yhEo8ld85rP}
      XAI_MODEL: ${XAI_MODEL:-grok-beta}

  booking-service:
    build: ./booking-service
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/rentlora
      JWT_SECRET: dev-secret
      AWS_DEFAULT_REGION: us-east-1

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - property-service
      - booking-service
      - ai-service

volumes:
  pgdata:
