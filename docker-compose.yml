version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: rentlora
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  property-service:
    build: ./property-service
    ports:
      - "8001:8001"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/rentlora
      JWT_SECRET: dev-secret
      S3_BUCKET_NAME: rentlora-assets
      AWS_DEFAULT_REGION: us-east-1

  booking-service:
    build: ./booking-service
    ports:
      - "8002:8002"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/rentlora
      JWT_SECRET: dev-secret
      AWS_DEFAULT_REGION: us-east-1

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - property-service
      - booking-service
    environment:
      INTERNAL_ALB_DNS: booking-service:8002

volumes:
  pgdata:
