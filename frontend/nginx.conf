events {}
http {
  include /etc/nginx/mime.types;
  server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location / {
      try_files $uri $uri/ /index.html;
    }
    location /properties { proxy_pass http://${INTERNAL_ALB_DNS}; }
    location /search { proxy_pass http://${INTERNAL_ALB_DNS}; }
    location /reviews { proxy_pass http://${INTERNAL_ALB_DNS}; }
    location /auth { proxy_pass http://${INTERNAL_ALB_DNS}; }
    location /users { proxy_pass http://${INTERNAL_ALB_DNS}; }
    location /bookings { proxy_pass http://${INTERNAL_ALB_DNS}; }
  }
}
