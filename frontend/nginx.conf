pid /tmp/nginx.pid;
events {}
http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  include /etc/nginx/mime.types;
  server {
    listen 8080;
    client_max_body_size 50M;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets (Vite emits content-hashed filenames) are immutable —
    # cache them forever at the browser + CloudFront edge.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # SPA only. In Kubernetes the edge gateway (kgateway / ingress) routes
    # /api/* to the backend services, so this container just serves static files.
    # index.html must NOT be cached, or CloudFront/browsers keep serving an old
    # bundle after a deploy (it references the freshly hashed assets each build).
    location / {
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ /index.html;
    }
  }
}
