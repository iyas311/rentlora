events {}
http {
  server {
    listen 80;
    resolver 127.0.0.11 valid=5s;

    # Route property service endpoints
    location ~ ^/(properties|search|reviews) {
      set $upstream_property property-service;
      proxy_pass http://$upstream_property:8001;
    }

    # Route booking service endpoints
    location ~ ^/(auth|users|bookings) {
      set $upstream_booking booking-service;
      proxy_pass http://$upstream_booking:8002;
    }
  }
}
