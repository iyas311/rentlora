# SonarCloud configuration. Adjust projectKey/organization to match your SonarCloud setup.
sonar.projectKey=rentlora_rentlora
sonar.organization=rentlora
sonar.host.url=https://sonarcloud.io

sonar.sources=backend,frontend/src
